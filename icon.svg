<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f1f2e" />
      <stop offset="100%" stop-color="#0e0e14" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3b30" />
      <stop offset="100%" stop-color="#e50914" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Box -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bgGrad)" stroke="#2b2b3d" stroke-width="3" />

  <!-- Outer Rewind / Recap Circular Arrow -->
  <path d="M 64,28 A 36,36 0 1,0 96,52" fill="none" stroke="url(#redGrad)" stroke-width="8" stroke-linecap="round" />
  <!-- Arrow Head -->
  <polygon points="56,28 68,18 68,38" fill="url(#redGrad)" />

  <!-- Play Symbol Center -->
  <polygon points="58,50 82,64 58,78" fill="#ffffff" filter="url(#glow)" />
</svg>
